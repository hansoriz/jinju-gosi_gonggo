name: 진주시 고시공고 감시

on:
  schedule:
    - cron: "2-59/10 * * * *"   # 매시 2,12,22,32,42,52분 (정각 혼잡을 피해 어긋나게 설정)
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식 (check=평소 확인 / test_mail=테스트 메일 / replay=최근 글로 알림 테스트)"
        type: choice
        default: check
        options: [check, test_mail, replay]
      replay_count:
        description: "replay 일 때 최근 몇 건을 검사할지"
        default: "10"

permissions:
  contents: write

concurrency:
  group: jinju-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      TO_EMAIL: ${{ secrets.TO_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 테스트 메일
        if: ${{ github.event.inputs.mode == 'test_mail' }}
        run: python jinju_notice_cloud.py --test

      - name: 최근 글로 알림 테스트
        if: ${{ github.event.inputs.mode == 'replay' }}
        run: python jinju_notice_cloud.py --replay ${{ github.event.inputs.replay_count }}

      - name: 게시판 확인
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'check' }}
        run: python jinju_notice_cloud.py --once

      - name: 확인한 글 기록 저장
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.mode == 'check') }}
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen.json [skip ci]"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
